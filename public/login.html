<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in – MediAssist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><div class="w">
  <a class="logo" href="index.html"><img src="logo.svg" alt="" width="32" height="32">MediAssist</a>
  <div class="links"><a href="doctors.html">Doctors</a><a href="index.html#departments">Departments</a><a href="pharmacy.html">Pharmacy</a><a href="index.html#concierge">Concierge</a></div>
  <div class="nr"><span class="sos">Emergency: 108</span><a class="btn" href="login.html">Login</a><a class="btn p" href="register.html">Register</a></div>
</div></nav>
<main class="w"><form class="card auth" id="f" novalidate>
  <h1>Log in</h1><p style="margin-bottom:20px">Welcome back.</p>
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
  <label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required>
  <div class="err" id="err" role="alert"></div>
  <button class="btn p" style="width:100%;justify-content:center" id="go">Log in</button>
  <p style="margin-top:16px;font-size:14px">New here? <a href="register.html" style="color:var(--p);font-weight:600">Create an account</a></p>
</form></main>
<script src="app.js"></script>
<script>
if (me()) location.href = "index.html";
$("#f").onsubmit = async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  $("#go").disabled = true; $("#err").textContent = "";
  try {
    const d = await api("/auth/login", { method: "POST", body });
    setSession(d);
    const next = new URLSearchParams(location.search).get("next");
    // only allow same-site .html pages as redirect targets
    location.href = next && /^[\w.\-]+\.html(\?[\w=&%.\-]*)?$/.test(next) ? next : "index.html";
  } catch (err) { $("#err").textContent = err.message; $("#go").disabled = false; }
};
</script>
</body>
</html>
