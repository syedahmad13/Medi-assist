<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register – MediAssist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><div class="w">
  <a class="logo" href="index.html"><i>+</i>MediAssist</a>
  <div class="links"><a href="doctors.html">Doctors</a><a href="index.html#departments">Departments</a><a href="pharmacy.html">Pharmacy</a><a href="index.html#concierge">Concierge</a></div>
  <div class="nr"><span class="sos">Emergency: 108</span><a class="btn" href="login.html">Login</a><a class="btn p" href="register.html">Register</a></div>
</div></nav>
<main class="w"><form class="card auth" id="f" novalidate>
  <h1>Create your account</h1><p style="margin-bottom:20px">Patients register here. Staff accounts are created by the hospital.</p>
  <label for="n">Full name</label><input id="n" name="name" autocomplete="name" required>
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
  <label for="ph">Phone (optional)</label><input id="ph" name="phone" type="tel" autocomplete="tel">
  <label for="pw">Password (8+ characters)</label><input id="pw" name="password" type="password" autocomplete="new-password" minlength="8" required>
  <div class="err" id="err" role="alert"></div>
  <button class="btn p" style="width:100%;justify-content:center" id="go">Register</button>
  <p style="margin-top:16px;font-size:14px">Already registered? <a href="login.html" style="color:var(--p);font-weight:600">Log in</a></p>
</form></main>
<script src="app.js"></script>
<script>
if (me()) location.href = "index.html";
$("#f").onsubmit = async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  $("#go").disabled = true; $("#err").textContent = "";
  try {
    setSession(await api("/auth/register", { method: "POST", body }));
    location.href = "index.html";
  } catch (err) { $("#err").textContent = err.message; $("#go").disabled = false; }
};
</script>
</body>
</html>
